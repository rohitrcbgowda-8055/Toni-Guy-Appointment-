<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b0b">
<title>TONI&GUY Essensuals Appointments</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#080808;color:#fff;margin:0;padding:18px}
main{max-width:760px;margin:auto}.card{background:#151515;border:1px solid #333;border-radius:16px;padding:18px;margin:14px 0}
label{display:block;color:#aaa;font-size:12px;margin:12px 0 5px}
input,select,textarea{width:100%;box-sizing:border-box;background:#0b0b0b;color:#fff;border:1px solid #444;border-radius:9px;padding:12px;font-size:16px}
.grid,.buttons,.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
button{padding:13px;border:0;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer}
.gold{background:#b9975b}.light{background:#eee}.dark{background:#222;color:#fff}.tab{background:#222;color:#aaa}.tab.active{background:#b9975b;color:#111}
.item{padding:14px 0;border-bottom:1px solid #333}.badge{float:right;padding:5px 8px;border-radius:15px;background:#493c20;color:#f2d18a;font-size:11px}
.ok{background:#243b28;color:#aee2b5}.past{background:#333;color:#bbb}.hidden{display:none}.empty{color:#888;padding:15px 0;text-align:center}
.small{font-size:12px;color:#888}.error{color:#ff9d9d}.success{color:#aee2b5}
@media(max-width:520px){.grid,.buttons,.tabs{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<div style="text-align:center"><b style="font-size:26px;letter-spacing:2px">TONI&GUY</b><div style="letter-spacing:5px;color:#bbb">ESSENSUALS</div></div>
<div id="loginCard" class="card">
<h2>Staff Login</h2>
<p class="small">Sign in to access the shared salon customer database.</p>
<label>Email</label><input id="email" type="email" placeholder="Salon staff email">
<label>Password</label><input id="password" type="password" placeholder="Password">
<button class="gold" id="login">Sign In</button>
<div id="loginMsg" class="small" style="margin-top:10px"></div>
</div>

<div id="app" class="hidden">
<div style="display:flex;justify-content:space-between;align-items:center"><div><h1>Appointment Manager</h1><div style="color:#999">RMV 2nd Stage · Bengaluru</div></div><button class="dark" id="logout">Sign Out</button></div>

<section class="card">
<b>New Appointment</b>
<label>Customer Name</label><input id="name" placeholder="Enter customer name">
<label>WhatsApp Number</label><input id="phone" maxlength="10" inputmode="tel" placeholder="10-digit mobile number">
<div id="customerHint" class="small"></div>
<div class="grid"><div><label>Date</label><input id="date" type="date"></div><div><label>Time</label><input id="time" type="time"></div></div>
<label>Service</label>
<select id="service">
<option>Haircut</option><option>Hair Wash</option><option>Blow Dry</option><option>Hair Colour</option><option>Highlights</option><option>Global Colour</option><option>Root Touch-up</option><option>Hair Spa</option><option>Keratin</option><option>Smoothening</option><option>Beard Grooming</option><option>Facial</option><option>Head Massage</option><option>Manicure</option><option>Pedicure</option><option>Styling</option><option>Other / Manual</option>
</select>
<div id="manualBox" class="hidden"><label>Manual Service Name</label><input id="manual" placeholder="Type service name"></div>
<label>Staff</label><input id="staff" placeholder="Staff name (optional)">
<label>Notes</label><textarea id="notes" rows="2" placeholder="Optional notes"></textarea>
<div class="buttons"><button class="light" id="save">Save Appointment</button><button class="gold" id="wa">Save & WhatsApp</button></div>
<div id="saveMsg" class="small" style="margin-top:10px"></div>
</section>

<section class="card">
<div class="tabs"><button class="tab active" id="upcomingTab">Upcoming</button><button class="tab" id="historyTab">History</button></div>
<label>Search customer name or phone</label><input id="search" placeholder="Search">
<div id="sectionTitle" style="margin-top:18px"><b>Upcoming Appointments</b><span id="count" style="float:right"></span></div>
<div id="list"></div>
</section>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Paste your Supabase Publishable key in the next line before deploying.
// Never use a secret/service-role key here.
const SUPABASE_URL="https://qnavbynymxdeulwuyhjm.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const q=id=>document.getElementById(id);
let currentView="upcoming", currentCustomer=null;

function today(){
 const d=new Date(), p={};
 new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Kolkata",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(d).forEach(x=>{if(x.type!=="literal")p[x.type]=x.value});
 return p.year+"-"+p.month+"-"+p.day;
}
q("date").value=today();
function formatDate(s){return new Date(s+"T12:00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});}
function esc(s){return String(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}

async function checkConfig(){
 if(SUPABASE_PUBLISHABLE_KEY.startsWith("PASTE_")) q("loginMsg").innerHTML='<span class="error">Add your Supabase Publishable key to this file before using the app.</span>';
}
async function init(){
 await checkConfig();
 const {data:{session}}=await sb.auth.getSession();
 setAuth(session);
 sb.auth.onAuthStateChange((_e,s)=>setAuth(s));
}
function setAuth(session){
 q("loginCard").classList.toggle("hidden",!!session);
 q("app").classList.toggle("hidden",!session);
 if(session) render();
}
q("login").onclick=async()=>{
 q("loginMsg").textContent="Signing in...";
 const {error}=await sb.auth.signInWithPassword({email:q("email").value.trim(),password:q("password").value});
 q("loginMsg").innerHTML=error?'<span class="error">'+esc(error.message)+'</span>':'';
};
q("logout").onclick=()=>sb.auth.signOut();

async function findCustomer(phone){
 if(!phone || phone.length!==10) return null;
 const {data,error}=await sb.from("customers").select("*").eq("phone",phone).maybeSingle();
 if(error){console.error(error);return null;}
 return data;
}
q("phone").oninput=async e=>{
 e.target.value=e.target.value.replace(/\D/g,"").slice(0,10);
 currentCustomer=null; q("customerHint").textContent="";
 if(e.target.value.length===10){
  currentCustomer=await findCustomer(e.target.value);
  if(currentCustomer){
   q("name").value=currentCustomer.name||"";
   q("customerHint").innerHTML='<span class="success">Returning customer found · '+currentCustomer.total_visits+' visits</span>';
  } else q("customerHint").textContent="New customer — will be saved automatically.";
 }
};
q("service").onchange=()=>q("manualBox").classList.toggle("hidden",q("service").value!=="Other / Manual");

async function saveAppointment(sendWA=false){
 const phone=q("phone").value.replace(/\D/g,"").slice(0,10), name=q("name").value.trim();
 const service=q("service").value==="Other / Manual"?(q("manual").value.trim()||"Manual Service"):q("service").value;
 if(!name||phone.length!==10||!q("date").value||!q("time").value){q("saveMsg").innerHTML='<span class="error">Enter name, valid 10-digit WhatsApp number, date and time.</span>';return;}
 q("saveMsg").textContent="Saving...";
 let customer=await findCustomer(phone);
 if(!customer){
  const r=await sb.from("customers").insert({name,phone,whatsapp_number:phone,first_visit:q("date").value,last_visit:q("date").value,total_visits:0,total_spend:0}).select().single();
  if(r.error){q("saveMsg").innerHTML='<span class="error">'+esc(r.error.message)+'</span>';return;}
  customer=r.data;
 } else if(customer.name!==name){
  const r=await sb.from("customers").update({name,updated_at:new Date().toISOString()}).eq("id",customer.id).select().single();
  if(!r.error) customer=r.data;
 }
 const r=await sb.from("appointments").insert({
  customer_id:customer.id,appointment_date:q("date").value,appointment_time:q("time").value,
  service,staff:q("staff").value.trim(),status:"Pending",notes:q("notes").value.trim()
 }).select().single();
 if(r.error){q("saveMsg").innerHTML='<span class="error">'+esc(r.error.message)+'</span>';return;}
 currentCustomer=customer;
 await refreshCustomerStats(customer.id);
 q("saveMsg").innerHTML='<span class="success">Appointment saved to cloud.</span>';
 const a={...r.data,name:customer.name,phone:customer.phone};
 reset(); render();
 if(sendWA) send(a);
}
async function refreshCustomerStats(id){
 const {data}=await sb.from("appointments").select("appointment_date,status").eq("customer_id",id);
 const rows=data||[], completed=rows.filter(x=>x.status==="Completed");
 const dates=rows.map(x=>x.appointment_date).sort();
 await sb.from("customers").update({
  total_visits:completed.length,
  first_visit:dates[0]||null,last_visit:dates[dates.length-1]||null,
  updated_at:new Date().toISOString()
 }).eq("id",id);
}
function reset(){["name","phone","staff","notes","manual"].forEach(x=>q(x).value="");q("date").value=today();q("time").value="";q("service").value="Haircut";q("manualBox").classList.add("hidden");q("customerHint").textContent="";currentCustomer=null;}
function send(a){
 const msg=`✨ TONI&GUY ESSENSUALS – APPOINTMENT CONFIRMATION ✨\n\nHello ${a.name},\n\nYour appointment has been booked with us.\n\n💇 Service: ${a.service}\n📅 Date: ${formatDate(a.appointment_date||a.date)}\n⏰ Time: ${a.appointment_time||a.time}${a.staff?"\n👤 Staff: "+a.staff:""}\n\nCould you please confirm if you’ll be able to make it at ${a.appointment_time||a.time}?\n\nPlease reply YES to confirm your appointment.\n\nWe look forward to welcoming you! ❤️\n\nTONI&GUY ESSENSUALS\nRMV 2nd Stage, Bengaluru\n📞 9606033535`;
 location.href="https://wa.me/91"+a.phone+"?text="+encodeURIComponent(msg);
}
q("save").onclick=()=>saveAppointment(false); q("wa").onclick=()=>saveAppointment(true); q("search").oninput=render;
q("upcomingTab").onclick=()=>{currentView="upcoming";q("upcomingTab").classList.add("active");q("historyTab").classList.remove("active");render();};
q("historyTab").onclick=()=>{currentView="history";q("historyTab").classList.add("active");q("upcomingTab").classList.remove("active");render();};

async function updateStatus(id,status){
 const {data:ap,error}=await sb.from("appointments").update({status}).eq("id",id).select().single();
 if(!error){await refreshCustomerStats(ap.customer_id);render();}
}
async function del(id){
 if(!confirm("Delete this appointment permanently?")) return;
 const {data:ap}=await sb.from("appointments").select("customer_id").eq("id",id).single();
 await sb.from("appointments").delete().eq("id",id);
 if(ap) await refreshCustomerStats(ap.customer_id);
 render();
}
async function reopen(id){updateStatus(id,"Pending")}
async function loadAppointments(){
 const {data,error}=await sb.from("appointments").select("id,customer_id,appointment_date,appointment_time,service,staff,status,notes,customers(name,phone)").order("appointment_date",{ascending:true}).order("appointment_time",{ascending:true});
 if(error){q("list").innerHTML='<div class="empty error">'+esc(error.message)+'</div>';return [];}
 return data||[];
}
async function render(){
 if(!q("app")||q("app").classList.contains("hidden")) return;
 const t=today(), all=await loadAppointments();
 let a=currentView==="upcoming"?all.filter(v=>v.appointment_date>=t&&v.status!=="Cancelled"):all.filter(v=>v.appointment_date<t||v.status==="Completed"||v.status==="Cancelled").sort((x,y)=>(y.appointment_date+y.appointment_time).localeCompare(x.appointment_date+x.appointment_time));
 const term=q("search").value.trim().toLowerCase();
 if(term)a=a.filter(v=>String(v.customers?.name||"").toLowerCase().includes(term)||String(v.customers?.phone||"").includes(term));
 q("count").textContent=a.length;
 q("sectionTitle").innerHTML='<b>'+(currentView==="upcoming"?"Upcoming Appointments":"Appointment History")+'</b><span id="count" style="float:right">'+a.length+'</span>';
 if(!a.length){q("list").innerHTML='<div class="empty">No appointments found.</div>';return;}
 q("list").innerHTML=a.map(x=>{
  const past=x.appointment_date<t||x.status==="Completed"||x.status==="Cancelled", badge=x.status==="Confirmed"?"ok":(past?"past":"");
  const actions=currentView==="upcoming"
   ?`<button class="dark" onclick="openWA('${x.id}')">WhatsApp</button><button class="gold" onclick="updateStatus('${x.id}','Confirmed')">${x.status==="Confirmed"?"Confirmed":"Confirm"}</button><button class="dark" onclick="updateStatus('${x.id}','Completed')">Completed</button><button class="dark" onclick="updateStatus('${x.id}','Cancelled')">Cancel</button>`
   :`<button class="dark" onclick="openWA('${x.id}')">WhatsApp</button><button class="dark" onclick="reopen('${x.id}')">Reopen</button><button class="dark" onclick="del('${x.id}')">Delete</button>`;
  return `<div class="item"><span class="badge ${badge}">${esc(x.status)}</span><b>${esc(x.customers?.name)}</b><div style="color:#aaa;font-size:13px;margin-top:5px">📅 ${formatDate(x.appointment_date)} · ⏰ ${esc(x.appointment_time)}<br>💇 ${esc(x.service)}${x.staff?" · 👤 "+esc(x.staff):""}<br>📱 +91 ${esc(x.customers?.phone)}${x.notes?"<br>📝 "+esc(x.notes):""}</div><div class="buttons">${actions}</div></div>`;
 }).join("");
}
async function openWA(id){
 const {data:x}=await sb.from("appointments").select("id,appointment_date,appointment_time,service,staff,customers(name,phone)").eq("id",id).single();
 if(x)send({...x,name:x.customers?.name,phone:x.customers?.phone});
}
init();
</script>
</body>
</html>
