<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<title>TONI&GUY Essensuals — Appointments</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:760px;margin:auto;padding:18px 16px 40px}.brand{text-align:center;padding:14px 0 20px;border-bottom:1px solid #292929}
.tg{font-size:25px;letter-spacing:2px;font-weight:700}.es{font-size:13px;letter-spacing:5px;color:#bbb;margin-top:4px}
h1{font-size:24px;margin:22px 0 5px}.sub{color:#999;font-size:14px;margin-bottom:18px}
.card{background:#121212;border:1px solid #292929;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 8px 28px #0008}
label{display:block;color:#aaa;font-size:12px;margin:12px 0 6px;text-transform:uppercase;letter-spacing:.7px}
input,select,textarea{width:100%;background:#0b0b0b;color:#fff;border:1px solid #333;border-radius:10px;padding:13px;font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:11px;padding:13px 15px;font-weight:700;font-size:15px;cursor:pointer}
.primary{background:#f2f2f2;color:#090909}.gold{background:#b9975b;color:#090909}.ghost{background:#202020;color:#fff;border:1px solid #383838}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.item{padding:14px 0;border-bottom:1px solid #292929}.item:last-child{border-bottom:0}.row{display:flex;justify-content:space-between;gap:10px}.name{font-weight:700}.meta{font-size:13px;color:#aaa;margin-top:5px;line-height:1.5}
.badge{font-size:11px;padding:5px 8px;border-radius:20px;background:#292929;height:max-content}.confirmed{background:#243b28;color:#aee2b5}.pending{background:#493c20;color:#f2d18a}
.empty{color:#888;text-align:center;padding:18px 0}.small{font-size:12px;color:#777}.topbar{display:flex;justify-content:space-between;align-items:center}.count{background:#b9975b;color:#000;border-radius:20px;padding:4px 9px;font-weight:700}
@media(max-width:520px){.grid{grid-template-columns:1fr}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="tg">TONI&GUY</div><div class="es">ESSENSUALS</div></div>
  <h1>Appointment Manager</h1><div class="sub">RMV 2nd Stage · Bengaluru</div>

  <div class="card">
    <div class="topbar"><strong>New Appointment</strong><span class="small">Saved on this device</span></div>
    <label>Customer Name</label><input id="name" placeholder="Enter customer name">
    <label>WhatsApp Number</label><input id="phone" inputmode="tel" placeholder="10-digit mobile number">
    <div class="grid">
      <div><label>Date</label><input id="date" type="date"></div>
      <div><label>Time</label><input id="time" type="time"></div>
    </div>
    <label>Service</label>
    <select id="service">
      <option>Haircut</option><option>Hair Colour</option><option>Hair Spa</option>
      <option>Beard Grooming</option><option>Facial</option><option>Head Massage</option>
      <option>Manicure</option><option>Pedicure</option><option>Other</option>
    </select>
    <label>Staff</label><input id="staff" placeholder="Staff name (optional)">
    <label>Notes</label><textarea id="notes" rows="2" placeholder="Any special request"></textarea>
    <div class="actions">
      <button class="btn primary" onclick="saveAppointment()">Save Appointment</button>
      <button class="btn gold" onclick="saveAndWhatsApp()">Save & WhatsApp</button>
    </div>
  </div>

  <div class="card">
    <div class="topbar"><strong>Today's Appointments</strong><span class="count" id="count">0</span></div>
    <div id="list" class="empty">No appointments yet.</div>
  </div>

  <div class="card">
    <button class="btn ghost" style="width:100%" onclick="clearAll()">Clear all local appointments</button>
    <p class="small">This starter version stores appointments in the browser. Connect Supabase later for multi-phone syncing, staff logins and cloud backup.</p>
  </div>
</div>
<script>
const key='essensualsAppointmentsV1';
const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);
$('date').value=today();

function get(){return JSON.parse(localStorage.getItem(key)||'[]')}
function put(x){localStorage.setItem(key,JSON.stringify(x)); render()}
function data(){
 return {id:Date.now(),name:$('name').value.trim(),phone:$('phone').value.replace(/\D/g,'').slice(-10),
 date:$('date').value,time:$('time').value,service:$('service').value,staff:$('staff').value.trim(),notes:$('notes').value.trim(),status:'Pending'};
}
function valid(a){if(!a.name||a.phone.length!==10||!a.date||!a.time)return false;return true}
function saveAppointment(){
 const a=data(); if(!valid(a)){alert('Please enter name, valid 10-digit WhatsApp number, date and time.');return}
 put([...get(),a]); alert('Appointment saved.'); reset();
}
function saveAndWhatsApp(){
 const a=data(); if(!valid(a)){alert('Please enter name, valid 10-digit WhatsApp number, date and time.');return}
 put([...get(),a]); reset(); openWA(a);
}
function openWA(a){
 const d=new Date(a.date+'T'+a.time);
 const date=d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
 const msg=`✨ TONI&GUY ESSENSUALS – APPOINTMENT CONFIRMATION%0A%0AHi ${a.name},%0A%0AYour appointment is booked with us.%0A%0AService: ${a.service}%0ADate: ${date}%0ATime: ${a.time}%0A${a.staff?'Staff: '+a.staff+'%0A':''}%0APlease reply YES to confirm your appointment.%0A%0AWe look forward to welcoming you!%0A%0ATONI&GUY Essensuals%0ARMV 2nd Stage, Bengaluru`;
 window.open('https://wa.me/91'+a.phone+'?text='+msg,'_blank');
}
function reset(){['name','phone','staff','notes'].forEach(x=>$(x).value='');$('date').value=today();$('time').value='';}
function confirmA(id){let x=get();let a=x.find(v=>v.id===id);if(a){a.status='Confirmed';put(x)}}
function deleteA(id){put(get().filter(v=>v.id!==id))}
function render(){
 const t=today(), arr=get().filter(a=>a.date===t).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
 $('count').textContent=arr.length;
 if(!arr.length){$('list').className='empty';$('list').textContent='No appointments yet.';return}
 $('list').className='';
 $('list').innerHTML=arr.map(a=>`<div class="item">
 <div class="row"><div><div class="name">${esc(a.name)}</div><div class="meta">${esc(a.time)} · ${esc(a.service)}${a.staff?' · '+esc(a.staff):''}<br>+91 ${esc(a.phone)}</div></div>
 <span class="badge ${a.status==='Confirmed'?'confirmed':'pending'}">${a.status}</span></div>
 <div class="actions"><button class="btn ghost" onclick="openWA(${a.id})">WhatsApp</button>${a.status!=='Confirmed'?`<button class="btn gold" onclick="confirmA(${a.id})">Confirm</button>`:`<button class="btn ghost" onclick="deleteA(${a.id})">Delete</button>`}</div>
 </div>`).join('');
}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function clearAll(){if(confirm('Delete all appointments saved on this device?')){localStorage.removeItem(key);render()}}
render();
</script>
</body>
</html>
