<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TONI&GUY Essensuals Appointments</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#080808;color:white;margin:0;padding:18px}main{max-width:700px;margin:auto}.card{background:#151515;border:1px solid #333;border-radius:16px;padding:18px;margin:14px 0}label{display:block;color:#aaa;font-size:12px;margin:12px 0 5px}input,select,textarea{width:100%;box-sizing:border-box;background:#0b0b0b;color:#fff;border:1px solid #444;border-radius:9px;padding:12px;font-size:16px}.grid,.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}button{padding:13px;border:0;border-radius:10px;font-weight:700;font-size:15px}.gold{background:#b9975b}.light{background:#eee}.dark{background:#222;color:#fff}.item{padding:12px 0;border-bottom:1px solid #333}.badge{float:right;padding:5px 8px;border-radius:15px;background:#493c20;color:#f2d18a;font-size:11px}.ok{background:#243b28;color:#aee2b5}.hidden{display:none}@media(max-width:520px){.grid,.buttons{grid-template-columns:1fr}}</style></head>
<body><main><div style="text-align:center"><b style="font-size:26px;letter-spacing:2px">TONI&GUY</b><div style="letter-spacing:5px;color:#bbb">ESSENSUALS</div></div>
<h1>Appointment Manager</h1><div style="color:#999">RMV 2nd Stage · Bengaluru</div>
<section class="card"><b>New Appointment</b>
<label>Customer Name</label><input id="name" placeholder="Enter customer name">
<label>WhatsApp Number</label><input id="phone" maxlength="10" inputmode="tel" placeholder="10-digit mobile number">
<div class="grid"><div><label>Date</label><input id="date" type="date"></div><div><label>Time</label><input id="time" type="time"></div></div>
<label>Service</label><select id="service"><option>Haircut</option><option>Hair Wash</option><option>Blow Dry</option><option>Hair Colour</option><option>Highlights</option><option>Global Colour</option><option>Root Touch-up</option><option>Hair Spa</option><option>Keratin</option><option>Smoothening</option><option>Beard Grooming</option><option>Facial</option><option>Head Massage</option><option>Manicure</option><option>Pedicure</option><option>Styling</option><option>Other / Manual</option></select>
<div id="manualBox" class="hidden"><label>Manual Service Name</label><input id="manual" placeholder="Type service name"></div>
<label>Staff</label><input id="staff" placeholder="Staff name (optional)"><label>Notes</label><textarea id="notes" rows="2"></textarea>
<div class="buttons"><button class="light" id="save">Save Appointment</button><button class="gold" id="wa">Save & WhatsApp</button></div></section>
<section class="card"><b>Today's Appointments</b><span id="count" style="float:right"></span><div id="list">No appointments yet.</div></section></main>
<script>
const K="essensualsAppointmentsFixed",q=id=>document.getElementById(id),today=()=>new Date().toISOString().slice(0,10);
q("date").value=today();
const get=()=>{try{return JSON.parse(localStorage.getItem(K)||"[]")}catch(e){return[]}},put=x=>{localStorage.setItem(K,JSON.stringify(x));render()};
function make(){return{id:String(Date.now())+Math.random(),name:q("name").value.trim(),phone:q("phone").value.replace(/\D/g,"").slice(-10),date:q("date").value,time:q("time").value,service:q("service").value==="Other / Manual"?(q("manual").value.trim()||"Manual Service"):q("service").value,staff:q("staff").value.trim(),notes:q("notes").value.trim(),status:"Pending"}}
function good(a){if(!a.name||a.phone.length!==10||!a.date||!a.time){alert("Please enter name, valid 10-digit WhatsApp number, date and time.");return false}if(q("service").value==="Other / Manual"&&!q("manual").value.trim()){alert("Please enter the manual service name.");return false}return true}
function save(){let a=make();if(good(a)){put([...get(),a]);alert("Appointment saved.");reset()}}
function send(a){let d=new Date(a.date+"T"+a.time),ds=d.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});let msg=`✨ TONI&GUY ESSENSUALS – APPOINTMENT CONFIRMATION ✨\n\nHello ${a.name},\n\nYour appointment has been booked with us.\n\n💇 Service: ${a.service}\n📅 Date: ${ds}\n⏰ Time: ${a.time}${a.staff?"\n👤 Staff: "+a.staff:""}\n\nCould you please confirm if you’ll be able to make it at ${a.time}?\n\nPlease reply YES to confirm your appointment.\n\nWe look forward to welcoming you! ❤️\n\nTONI&GUY ESSENSUALS\nRMV 2nd Stage, Bengaluru\n📞 9606033535`;location.href="https://wa.me/91"+a.phone+"?text="+encodeURIComponent(msg)}
function saveWA(){let a=make();if(good(a)){put([...get(),a]);reset();send(a)}}
function reset(){["name","phone","staff","notes","manual"].forEach(x=>q(x).value="");q("date").value=today();q("time").value="";q("service").value="Haircut";q("manualBox").classList.add("hidden")}
function confirmA(id){let a=get(),x=a.find(v=>v.id===id);if(x){x.status="Confirmed";put(a)}}
function del(id){put(get().filter(v=>v.id!==id))}
function esc(s){return String(s||"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function openSaved(id){let a=get().find(v=>v.id===id);if(a)send(a)}
function render(){let a=get().filter(v=>v.date===today()).sort((x,y)=>x.time.localeCompare(y.time));q("count").textContent=a.length;if(!a.length){q("list").textContent="No appointments yet.";return}q("list").innerHTML=a.map(x=>`<div class="item"><span class="badge ${x.status==="Confirmed"?"ok":""}">${x.status}</span><b>${esc(x.name)}</b><div style="color:#aaa;font-size:13px;margin-top:5px">${esc(x.time)} · ${esc(x.service)}${x.staff?" · "+esc(x.staff):""}<br>+91 ${esc(x.phone)}</div><div class="buttons"><button class="dark" onclick="openSaved('${x.id}')">WhatsApp</button>${x.status==="Pending"?`<button class="gold" onclick="confirmA('${x.id}')">Confirm</button>`:`<button class="dark" onclick="del('${x.id}')">Delete</button>`}</div></div>`).join("")}
q("service").onchange=()=>q("manualBox").classList.toggle("hidden",q("service").value!=="Other / Manual");q("phone").oninput=e=>e.target.value=e.target.value.replace(/\D/g,"").slice(0,10);q("save").onclick=save;q("wa").onclick=saveWA;render();
</script></body></html>
