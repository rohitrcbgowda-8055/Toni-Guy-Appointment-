<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b0b0b">
<link rel="manifest" href="manifest.json">
<title>TONI&GUY Essensuals Appointments</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#080808;color:white;margin:0;padding:18px}
main{max-width:700px;margin:auto}.card{background:#151515;border:1px solid #333;border-radius:16px;padding:18px;margin:14px 0}
label{display:block;color:#aaa;font-size:12px;margin:12px 0 5px}
input,select,textarea{width:100%;box-sizing:border-box;background:#0b0b0b;color:#fff;border:1px solid #444;border-radius:9px;padding:12px;font-size:16px}
.grid,.buttons,.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
button{padding:13px;border:0;border-radius:10px;font-weight:700;font-size:15px;cursor:pointer}
.gold{background:#b9975b}.light{background:#eee}.dark{background:#222;color:#fff}
.item{padding:14px 0;border-bottom:1px solid #333}.badge{float:right;padding:5px 8px;border-radius:15px;background:#493c20;color:#f2d18a;font-size:11px}
.ok{background:#243b28;color:#aee2b5}.past{background:#333;color:#bbb}.hidden{display:none}
.tab{background:#222;color:#aaa}.tab.active{background:#b9975b;color:#111}.empty{color:#888;padding:15px 0;text-align:center}
.search{margin-top:12px}
@media(max-width:520px){.grid,.buttons,.tabs{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
<div style="text-align:center">
<b style="font-size:26px;letter-spacing:2px">TONI&GUY</b>
<div style="letter-spacing:5px;color:#bbb">ESSENSUALS</div>
</div>

<h1>Appointment Manager</h1>
<div style="color:#999">RMV 2nd Stage · Bengaluru</div>

<section class="card">
<b>New Appointment</b>

<label>Customer Name</label>
<input id="name" placeholder="Enter customer name">

<label>WhatsApp Number</label>
<input id="phone" maxlength="10" inputmode="tel" placeholder="10-digit mobile number">

<div class="grid">
<div><label>Date</label><input id="date" type="date"></div>
<div><label>Time</label><input id="time" type="time"></div>
</div>

<label>Service</label>
<select id="service">
<option>Haircut</option><option>Hair Wash</option><option>Blow Dry</option>
<option>Hair Colour</option><option>Highlights</option><option>Global Colour</option>
<option>Root Touch-up</option><option>Hair Spa</option><option>Keratin</option>
<option>Smoothening</option><option>Beard Grooming</option><option>Facial</option>
<option>Head Massage</option><option>Manicure</option><option>Pedicure</option>
<option>Styling</option><option>Other / Manual</option>
</select>

<div id="manualBox" class="hidden">
<label>Manual Service Name</label>
<input id="manual" placeholder="Type service name">
</div>

<label>Staff</label>
<input id="staff" placeholder="Staff name (optional)">

<label>Notes</label>
<textarea id="notes" rows="2" placeholder="Optional notes"></textarea>

<div class="buttons">
<button class="light" id="save">Save Appointment</button>
<button class="gold" id="wa">Save & WhatsApp</button>
</div>
</section>

<section class="card">
<div class="tabs">
<button class="tab active" id="upcomingTab">Upcoming</button>
<button class="tab" id="historyTab">History</button>
</div>

<div class="search">
<input id="search" placeholder="Search customer name or phone">
</div>

<div id="sectionTitle" style="margin-top:18px"><b>Upcoming Appointments</b><span id="count" style="float:right"></span></div>
<div id="list"></div>
</section>
</main>

<script>
const K="essensualsAppointmentsFixed";
const q=id=>document.getElementById(id);
let currentView="upcoming";

function today(){
  const d=new Date();
  const parts=new Intl.DateTimeFormat("en-CA",{
    timeZone:"Asia/Kolkata",year:"numeric",month:"2-digit",day:"2-digit"
  }).formatToParts(d);
  const p={};
  parts.forEach(x=>{if(x.type!=="literal")p[x.type]=x.value});
  return p.year+"-"+p.month+"-"+p.day;
}

q("date").value=today();

const get=()=>{
  try{return JSON.parse(localStorage.getItem(K)||"[]")}
  catch(e){return[]}
};
const put=x=>{localStorage.setItem(K,JSON.stringify(x));render()};

function make(){
  return{
    id:String(Date.now())+Math.random(),
    name:q("name").value.trim(),
    phone:q("phone").value.replace(/\D/g,"").slice(-10),
    date:q("date").value,
    time:q("time").value,
    service:q("service").value==="Other / Manual"
      ?(q("manual").value.trim()||"Manual Service")
      :q("service").value,
    staff:q("staff").value.trim(),
    notes:q("notes").value.trim(),
    status:"Pending",
    createdAt:new Date().toISOString()
  };
}

function good(a){
  if(!a.name||a.phone.length!==10||!a.date||!a.time){
    alert("Please enter name, valid 10-digit WhatsApp number, date and time.");
    return false;
  }
  if(q("service").value==="Other / Manual"&&!q("manual").value.trim()){
    alert("Please enter the manual service name.");
    return false;
  }
  return true;
}

function formatDate(s){
  return new Date(s+"T12:00:00").toLocaleDateString("en-IN",{
    day:"2-digit",month:"short",year:"numeric"
  });
}

function save(){
  const a=make();
  if(good(a)){
    put([...get(),a]);
    alert("Appointment saved for "+formatDate(a.date)+" at "+a.time);
    reset();
  }
}

function send(a){
  const msg=`✨ TONI&GUY ESSENSUALS – APPOINTMENT CONFIRMATION ✨

Hello ${a.name},

Your appointment has been booked with us.

💇 Service: ${a.service}
📅 Date: ${formatDate(a.date)}
⏰ Time: ${a.time}${a.staff?"\n👤 Staff: "+a.staff:""}

Could you please confirm if you’ll be able to make it at ${a.time}?

Please reply YES to confirm your appointment.

We look forward to welcoming you! ❤️

TONI&GUY ESSENSUALS
RMV 2nd Stage, Bengaluru
📞 9606033535`;
  location.href="https://wa.me/91"+a.phone+"?text="+encodeURIComponent(msg);
}

function saveWA(){
  const a=make();
  if(good(a)){
    put([...get(),a]);
    reset();
    send(a);
  }
}

function reset(){
  ["name","phone","staff","notes","manual"].forEach(x=>q(x).value="");
  q("date").value=today();
  q("time").value="";
  q("service").value="Haircut";
  q("manualBox").classList.add("hidden");
}

function confirmA(id){
  const a=get(),x=a.find(v=>v.id===id);
  if(x){x.status="Confirmed";put(a)}
}
function completeA(id){
  const a=get(),x=a.find(v=>v.id===id);
  if(x){x.status="Completed";put(a)}
}
function cancelA(id){
  const a=get(),x=a.find(v=>v.id===id);
  if(x){x.status="Cancelled";put(a)}
}
function reopenA(id){
  const a=get(),x=a.find(v=>v.id===id);
  if(x){x.status="Pending";put(a)}
}
function del(id){
  if(confirm("Delete this appointment permanently?")) put(get().filter(v=>v.id!==id));
}
function esc(s){
  return String(s||"").replace(/[&<>"]/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"
  }[m]));
}
function openSaved(id){
  const a=get().find(v=>v.id===id);
  if(a)send(a);
}

function render(){
  const t=today();
  let all=get();
  all.sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));

  let a;
  if(currentView==="upcoming"){
    a=all.filter(v=>v.date>=t && v.status!=="Cancelled");
  }else{
    a=all.filter(v=>v.date<t || v.status==="Completed" || v.status==="Cancelled")
         .sort((x,y)=>(y.date+y.time).localeCompare(x.date+x.time));
  }

  const term=q("search").value.trim().toLowerCase();
  if(term){
    a=a.filter(v=>
      String(v.name||"").toLowerCase().includes(term) ||
      String(v.phone||"").includes(term)
    );
  }

  q("count").textContent=a.length;
  q("sectionTitle").innerHTML=
    `<b>${currentView==="upcoming"?"Upcoming Appointments":"Appointment History"}</b>
     <span id="count" style="float:right">${a.length}</span>`;

  if(!a.length){
    q("list").innerHTML=
      `<div class="empty">${currentView==="upcoming"
        ?"No upcoming appointments."
        :"No appointment history yet."}</div>`;
    return;
  }

  q("list").innerHTML=a.map(x=>{
    const isPast=x.date<t || x.status==="Completed" || x.status==="Cancelled";
    const badge=x.status==="Confirmed"?"ok":(isPast?"past":"");

    let actions;
    if(currentView==="upcoming"){
      actions=`
        <button class="dark" onclick="openSaved('${x.id}')">WhatsApp</button>
        <button class="gold" onclick="confirmA('${x.id}')">${x.status==="Confirmed"?"Confirmed":"Confirm"}</button>
        <button class="dark" onclick="completeA('${x.id}')">Completed</button>
        <button class="dark" onclick="cancelA('${x.id}')">Cancel</button>`;
    }else{
      actions=`
        <button class="dark" onclick="openSaved('${x.id}')">WhatsApp</button>
        <button class="dark" onclick="reopenA('${x.id}')">Reopen</button>
        <button class="dark" onclick="del('${x.id}')">Delete</button>`;
    }

    return `<div class="item">
      <span class="badge ${badge}">${esc(x.status)}</span>
      <b>${esc(x.name)}</b>
      <div style="color:#aaa;font-size:13px;margin-top:5px">
        📅 ${formatDate(x.date)} · ⏰ ${esc(x.time)}
        <br>💇 ${esc(x.service)}${x.staff?" · 👤 "+esc(x.staff):""}
        <br>📱 +91 ${esc(x.phone)}
        ${x.notes?"<br>📝 "+esc(x.notes):""}
      </div>
      <div class="buttons">${actions}</div>
    </div>`;
  }).join("");
}

q("service").onchange=()=>{
  q("manualBox").classList.toggle("hidden",q("service").value!=="Other / Manual");
};
q("phone").oninput=e=>{
  e.target.value=e.target.value.replace(/\D/g,"").slice(0,10);
};
q("search").oninput=render;
q("save").onclick=save;
q("wa").onclick=saveWA;

q("upcomingTab").onclick=()=>{
  currentView="upcoming";
  q("upcomingTab").classList.add("active");
  q("historyTab").classList.remove("active");
  render();
};
q("historyTab").onclick=()=>{
  currentView="history";
  q("historyTab").classList.add("active");
  q("upcomingTab").classList.remove("active");
  render();
};

render();
</script>
</body>
</html>
